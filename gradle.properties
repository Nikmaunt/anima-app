# JVM args for the Gradle daemon. 6g: lint analysis of the MediaPipe
# tasks-genai AAR needs headroom — at 3g it GC-thrashed into apparent
# deadlocks (v0.2 "lintVital hang"; see docs/research-v3.md §lint).
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Build speed
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
# Smaller, faster R classes: each module gets only its own resources.
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Gradle Managed Devices (v0.3, research-v3 §C.2). Auto-download the ATD
# system image (SDK licenses are pre-accepted on this machine); software
# rendering + one concurrent AVD are the documented Windows-stability set.
android.builder.sdkDownload=true
android.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
android.experimental.testOptions.managedDevices.maxConcurrentDevices=1
android.experimental.testOptions.managedDevices.setupTimeoutMinutes=30
