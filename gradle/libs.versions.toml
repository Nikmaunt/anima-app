# Single source of truth for all dependency + plugin versions.
# Toolchain pins proven-resolvable on this machine (AGP 8.13.0 / Gradle 8.14.3
# already cached by the sibling hermes-app build).
#
# Deliberately absent: any network stack (OkHttp/Retrofit/Ktor). Anima makes
# zero network calls; the absence of these coordinates is part of the guarantee
# and is enforced by NetworkIsolationTest.

[versions]
# --- Build toolchain ---
agp = "8.13.0"
kotlin = "2.2.0"
ksp = "2.2.0-2.0.2"
# --- AndroidX / Compose ---
androidxCore = "1.17.0"
androidxActivity = "1.11.0"
androidxLifecycle = "2.9.0"
androidxNavigation = "2.9.0"
composeBom = "2025.06.01"
androidxDatastore = "1.1.7"
androidxSplashscreen = "1.2.0"
# Widget (ADR-007): Glance renders to RemoteViews; 1.2.0-rc01 is the current
# line (stable 1.1.1 is a 2024 build). WorkManager only for the charge-edge
# one-shot triggers — battery broadcasts are not manifest-receivable (research-v2 §B.1).
androidxGlance = "1.2.0-rc01"
androidxWork = "2.10.1"
androidxHiltNavigation = "1.2.0"
# --- DI ---
hilt = "2.57"
# --- Persistence ---
room = "2.7.2"
# v0.3 security bump (CVE audit 2026-07-17, threat-model.md): 4.6.1 bundled
# SQLite 3.46.1 (CVE-2025-29087/6965 range) and pre-4.15 sqlcipher_export
# name sanitization; 4.17.0 carries SQLite 3.53.3. Open/key path re-verified
# by the GMD suite (SoulVaultDeviceTest) on this bump.
sqlcipher = "4.17.0"
androidxSqlite = "2.5.2"
# --- On-device GenAI (ML Kit GenAI / AICore, on-device only) ---
# genai-prompt 1.0.0-beta3 (2026-07-14), verified against the Google Maven
# index during Phase-0 research; see docs/research.md §C.
mlkitGenaiPrompt = "1.0.0-beta3"
# MediaPipe LLM Inference (GEMMA tier, ADR-005). tasks-genai 0.10.35 verified
# latest on Google Maven 2026-07-17; maintenance mode, LiteRT-LM is the
# designated successor (migration recorded in ADR-005). NOT a network library:
# it runs a local .task/.litertlm file.
mediapipeTasksGenai = "0.10.35"
# --- Play Asset Delivery (ADR-010): Play-managed model pack. IPC to the
# Play Store app, not an HTTP stack — the network-library ban stands. 2.3.0
# verified latest on Google Maven 2026-07-17.
playAssetDelivery = "2.3.0"
# --- Kotlinx ---
coroutines = "1.10.2"
serialization = "1.8.1"
# --- Performance (baseline profile generation is device-bound; ADR-006) ---
benchmark = "1.4.1"
profileinstaller = "1.4.1"
uiautomator = "2.3.0"
# --- Static analysis ---
# detekt 1.23.8 is the last stable line (2.0 still alpha, 2026-07); compiled
# against Kotlin 2.0.21 — fine for rule analysis without type resolution.
detekt = "1.23.8"
# jlleitschuh wrapper 13.1.0 + ktlint engine 1.7.1 (Kotlin 2.2-aware).
ktlintPlugin = "13.1.0"
ktlintEngine = "1.7.1"
# --- Test ---
junit4 = "4.13.2"
truth = "1.4.4"
turbine = "1.2.0"
robolectric = "4.14.1"
# Screenshot regression (v0.4 Phase 0.4): Roborazzi rides the existing
# Robolectric+Compose test stack; goldens live in src/test/screenshots.
# 1.69.0 verified present on Maven Central 2026-07-18.
roborazzi = "1.69.0"
androidxTestExtJunit = "1.3.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxEspresso = "3.7.0"

[libraries]
# --- Plugin artifacts consumed by build-logic convention plugins ---
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradlePlugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }

# --- AndroidX core / lifecycle / navigation ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }

# --- Compose (versions come from the BOM) ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

# --- DataStore / Splash ---
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidxSplashscreen" }

# --- Model delivery (confined to :core:model-delivery) ---
play-asset-delivery-ktx = { group = "com.google.android.play", name = "asset-delivery-ktx", version.ref = "playAssetDelivery" }

# --- Widget ---
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "androidxGlance" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidxWork" }

# --- DI ---
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHiltNavigation" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# --- Persistence (encrypted) ---
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
androidx-sqlite-ktx = { group = "androidx.sqlite", name = "sqlite-ktx", version.ref = "androidxSqlite" }

# --- Kotlinx ---
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# --- On-device GenAI (confined to :core:mind) ---
mlkit-genai-prompt = { group = "com.google.mlkit", name = "genai-prompt", version.ref = "mlkitGenaiPrompt" }
mediapipe-tasks-genai = { group = "com.google.mediapipe", name = "tasks-genai", version.ref = "mediapipeTasksGenai" }

# --- Performance ---
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

# --- Test ---
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxEspresso" }

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }

# --- Convention plugins (defined in build-logic) ---
anima-android-application = { id = "anima.android.application", version = "unspecified" }
anima-android-library = { id = "anima.android.library", version = "unspecified" }
anima-kotlin-jvm = { id = "anima.kotlin.jvm", version = "unspecified" }
anima-android-compose = { id = "anima.android.compose", version = "unspecified" }
anima-hilt = { id = "anima.hilt", version = "unspecified" }
anima-room = { id = "anima.room", version = "unspecified" }
