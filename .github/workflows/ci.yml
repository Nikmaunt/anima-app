# v0.6 release engineering: the REAL CI (the repo remembers v0.3's fake
# promise — this one runs or the badge lies). Two jobs:
#   checks — unit + goldens + static analysis + lintVital + assembleDebug
#   gmd    — the instrumented suite on a gradle-managed aosp-atd emulator
#            (KVM on GitHub-hosted Linux since 2024-04; research-v6 §B.6);
#            one built-in retry because GMD-on-CI has a documented flake
#            history (issuetracker 193118030) — a retried pass is green,
#            two failures are a real red.
# No signing here: CI builds release UNSIGNED by design (signing.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Static analysis (detekt + ktlint)
        run: ./gradlew detekt ktlintCheck

      # v1.1c task 1.1. This step used to be `./gradlew testDebugUnitTest`, and
      # it was wrong three ways at once:
      #   * it never ran `core:model`, a JVM module whose test task is `test` —
      #     116 executions, the largest single block in the tree, unmeasured;
      #   * it never ran the release variant, where NetworkIsolationTest and the
      #     permission allowlist actually matter;
      #   * with the build cache on, a test task could come back FROM-CACHE and
      #     report a previous tree's results as this one's.
      # `check` covers every module and both variants. `-Panima.ci=true` strips
      # every test task of the right to be up-to-date or cached and makes the
      # build refuse to start if golden comparison is off. `--no-build-cache`
      # says the same thing a second way. The log is kept because the next step
      # is what reads it.
      - name: Tests + goldens (the whole check contour, forced to execute)
        run: |
          find . -path "*/build/test-results" -type d -exec rm -rf {} + || true
          set -o pipefail
          ./gradlew -Panima.ci=true check --no-build-cache | tee build-check.log

      # The step that makes the one above mean something. Fails if any test task
      # was UP-TO-DATE/FROM-CACHE, if the Roborazzi finalize task was SKIPPED
      # (captured but never compared), if a golden was silently re-recorded, or
      # if no results exist at all. Reports EXECUTIONS, and says so.
      - name: The green build has to have measured something
        run: python3 tools/ci-verify.py --log build-check.log --min-executions 30 --min-goldens 40

      # Two checks, because they answer different questions. The first is a
      # dependency-change detector on the committed export. The second is the
      # legal one: the file the user actually sees is generated per variant
      # and shadows the committed one at resource merge (v0.9 Phase L —
      # committed 227, release 192), so freshness of the committed export
      # says nothing about whether the shipping attribution is complete.
      - name: Licenses export is fresh (fails if a dep changed without it)
        run: |
          ./gradlew :app:exportLibraryDefinitions
          git diff --exit-code app/src/main/res/raw/aboutlibraries.json

      - name: Release lint (lintVital)
        run: ./gradlew :app:lintVitalRelease

      - name: Debug APK + unsigned release bundle
        run: ./gradlew :app:assembleDebug :app:bundleRelease

      # Must follow the bundle step: it reads the per-variant attribution that
      # the release build generates, and is deliberately not wired to generate
      # it itself (see the task's comment in app/build.gradle.kts).
      - name: Release attribution covers everything that ships
        run: ./gradlew :app:verifyReleaseLicenseAttribution

      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: "**/build/outputs/roborazzi/"
          if-no-files-found: ignore

  gmd:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Instrumented suite on managed device (one retry for GMD flakes)
        run: >
          ./gradlew atd34DebugAndroidTest
          || ./gradlew atd34DebugAndroidTest

      - name: Upload instrumentation results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gmd-results
          path: "**/build/outputs/androidTest-results/"
          if-no-files-found: ignore
