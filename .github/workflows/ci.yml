# v0.6 release engineering: the REAL CI (the repo remembers v0.3's fake
# promise — this one runs or the badge lies). Two jobs:
#   checks — unit + goldens + static analysis + lintVital + assembleDebug
#   gmd    — the instrumented suite on a gradle-managed aosp-atd emulator
#            (KVM on GitHub-hosted Linux since 2024-04; research-v6 §B.6);
#            one built-in retry because GMD-on-CI has a documented flake
#            history (issuetracker 193118030) — a retried pass is green,
#            two failures are a real red.
# No signing here: CI builds release UNSIGNED by design (signing.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Static analysis (detekt + ktlint)
        run: ./gradlew detekt ktlintCheck

      - name: Unit tests (incl. NetworkIsolationTest + backup round-trip)
        run: ./gradlew testDebugUnitTest

      - name: Screenshot regression (Roborazzi verify)
        run: ./gradlew verifyRoborazziDebug

      - name: Licenses export is fresh (fails if a dep changed without it)
        run: |
          ./gradlew :app:exportLibraryDefinitions
          git diff --exit-code app/src/main/res/raw/aboutlibraries.json

      - name: Release lint (lintVital)
        run: ./gradlew :app:lintVitalRelease

      - name: Debug APK + unsigned release bundle
        run: ./gradlew :app:assembleDebug :app:bundleRelease

      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: "**/build/outputs/roborazzi/"
          if-no-files-found: ignore

  gmd:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Instrumented suite on managed device (one retry for GMD flakes)
        run: >
          ./gradlew atd34DebugAndroidTest
          || ./gradlew atd34DebugAndroidTest

      - name: Upload instrumentation results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gmd-results
          path: "**/build/outputs/androidTest-results/"
          if-no-files-found: ignore
